<span class="f far"  style="--l:4%;--t:66%;--s:24px;--r:-8deg;--dur:14s;--d:2.1s;--dy:-18px">&#10024;</span>
<span class="f far"  style="--l:93%;--t:70%;--s:28px;--r:12deg;--dur:12s;--d:.7s;--dy:-24px;--dx:-8px">&#127881;</span>

<div class="wrap">
<h1 class="rv">Come alone.<br><span class="hl">Play the room.</span></h1>
</div>
<div class="reelstage">
<div class="reel pola" id="reel">
<div class="tile lead-tile"><div class="shot"><img src="img/pub.jpg" alt="A full table under the lights"></div><span class="hand">Drunken Monkey Hostel, 2026</span></div>
<div class="tile t2"><div class="shot"><img src="img/selfie.jpg" alt="Selfie from a table"></div></div>
<div class="tile t3"><div class="shot"><img src="img/courtyard.jpg" alt="The courtyard mid-night"></div></div>
<div class="tile t4"><div class="shot"><img src="img/table.jpg" alt="Players at a table"></div></div>
<div class="tile plus"><div class="shot"><img src="img/bench.jpg" alt="Three players on a bench"></div></div>
</div>
</div>
<div class="wrap">
<div class="badges rv" style="--d:.16s">
<a href="https://apps.apple.com/app/id6778055243" aria-label="Download on the App Store"><img src="img/appstore.svg" alt="Download on the App Store"></a>
<a href="https://play.google.com/store/apps/details?id=com.kaanf.crew" aria-label="Get it on Google Play"><img src="img/googleplay.png" alt="Get it on Google Play"></a>
</div>
</div>
</section>

<script>
(function(){var r=document.getElementById('reel');if(!r)return;var i=0;
var SEQ=[['pola',2200],['open',3400]];
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){r.className='reel open';return;}
r.className='reel pola';
setTimeout(function step(){var s=SEQ[i];r.className='reel '+s[0];i=(i+1)%SEQ.length;setTimeout(step,s[1]);},1200);
})();
</script>
</body>
